[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmr-craft"
version = "0.1.0"
description = "Formula-constrained NMR candidate retrieval, fragment recombination, and model reranking"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "requests",
  "PyYAML",
  "lmdb",
  "rdkit",
  "tqdm",
]

[project.optional-dependencies]
database = ["faiss-cpu", "Flask"]
model = ["torch", "transformers"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["nmr_craft*"]

